<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowHow: prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<style>
/* Theme tokens: the only place where colours, type and spacing are defined. */
:root {
  --font-family: 'Google Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --color-bg: #F5F5F5;
  --color-surface: #FFFFFF;
  --color-subtle: #EBEBEB;
  --color-text: #111111;
  --color-text-muted: #555555;
  --color-text-dim: #6B6B6B;
  --color-border: #D4D4D4;
  --color-border-strong: #8A8A8A;
  /* Brand blue and its variations (palette 1) */
  --color-primary: #28519D;
  --color-primary-strong: #1E3F78; /* hover */
  --color-primary-deep: #142A4F;   /* pressed, deepest tone */
  --color-primary-mid: #326AC9;    /* links */
  --color-primary-bright: #3D7FF2; /* highlights and tints */
  --color-primary-tint: #ECF2FE;   /* primary-bright at 10 % on white */
  --color-on-primary: #FFFFFF;
  --color-edge: #BDBDBD;
  --color-edge-strong: #1E3F78;
  --shadow-focus: 0 0 0 1px rgba(17, 17, 17, 0.14), 0 3px 14px rgba(17, 17, 17, 0.5);
  --shadow-focus-svg: drop-shadow(0 2px 6px rgba(17, 17, 17, 0.6));
  /* Status icons */
  --color-status-pending: #C23C3C;
  --color-status-progress: #27519B;
  --color-status-done: #00BB02;
  --color-status-alert: #FFC72A;
  /* Flow colours (palette 2). The app sets --flow, --flow-strong, --flow-on, --flow-tint and --flow-visited per flow. */
  --flow-1: #28519D; --flow-2: #7D6AC2; --flow-3: #CA88D6; --flow-4: #B45684; --flow-5: #902E33; --flow-6: #E58B52;
  --flow-7: #976C00; --flow-8: #A8AC3D; --flow-9: #206616; --flow-10: #27BF9A; --flow-11: #00868D; --flow-12: #32B2E8;
  /* Category conventions (tag badges and legend). Slot N applies to the Nth category. */
  --color-cat-1-bg: #E3E3E3; --color-cat-1-text: #111111; --color-cat-1-border: #111111;
  --color-cat-2-bg: #555555; --color-cat-2-text: #FFFFFF; --color-cat-2-border: #555555;
  --color-cat-3-bg: #FFFFFF; --color-cat-3-text: #111111; --color-cat-3-border: #111111;
  --color-cat-4-bg: #BDBDBD; --color-cat-4-text: #111111; --color-cat-4-border: #6B6B6B;
  --radius: 8px;
  --radius-lg: 12px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-family); font-size: var(--text-md); line-height: 1.5; }
h1, h2, p, ul, ol, dl, dd { margin: 0; padding: 0; }
h1 { font-size: var(--text-xl); line-height: 1.25; font-weight: 500; }
h2 { font-size: var(--text-lg); line-height: 1.3; font-weight: 500; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; background: var(--color-subtle); padding: 1px 6px; border-radius: 4px; }
:focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--shadow-focus); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--color-text-muted); }
.small { font-size: var(--text-sm); }
.pad { padding: var(--space-6); }
.ico { flex: none; }
.i-pending { fill: var(--color-status-pending); } .i-progress { fill: var(--color-status-progress); }
.i-done { fill: var(--color-status-done); } .i-alert { fill: var(--color-status-alert); }
.i-close, .i-back, .i-link, .i-sub, .i-wait, .i-zoom { fill: currentColor; }
.btn .ico { margin-right: 8px; vertical-align: -1px; }
.flow-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--flow, var(--color-primary)); flex: none; }
h1 .flow-dot { margin-right: 12px; }
a { color: var(--color-primary-mid); }

.top { background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.top-in { max-width: 1320px; margin: 0 auto; padding: var(--space-2) var(--space-6); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); }
.brand { display: flex; align-items: center; gap: var(--space-3); font-weight: 500; }
.logo { display: block; height: 26px; width: auto; max-width: 58vw; }
.tag { font-size: var(--text-xs); font-weight: 400; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 10px; }
.top nav { display: flex; gap: var(--space-2); }
.top nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius); color: var(--color-text); text-decoration: none; font-size: var(--text-sm); font-weight: 500; }
.top nav a:hover { background: var(--color-subtle); }
.top nav a[aria-current] { background: var(--color-primary); color: var(--color-on-primary); }

.page { max-width: 1320px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-10); display: flex; flex-direction: column; gap: var(--space-4); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.status { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.pub { display: flex; align-items: center; gap: var(--space-4); }
.msg { min-height: 24px; font-size: var(--text-sm); font-weight: 500; }

.btn { min-height: 44px; padding: 0 var(--space-4); border: 1px solid var(--color-border-strong); border-radius: var(--radius); background: var(--color-surface); color: var(--color-text); font-size: var(--text-sm); font-weight: 500; cursor: pointer; }
.btn:not(:disabled):hover { background: var(--color-subtle); }
.btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.btn.primary:not(:disabled):hover { background: var(--color-primary-strong); border-color: var(--color-primary-strong); }
.btn.primary:not(:disabled):active { background: var(--color-primary-deep); border-color: var(--color-primary-deep); }
.btn.ghost { border-color: transparent; }
.btn:disabled { cursor: not-allowed; opacity: 0.45; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: var(--color-text-muted); font-size: 18px; line-height: 1; cursor: pointer; }
.icon-btn:hover { background: var(--color-subtle); color: var(--color-text); }

input[type="text"], select, textarea { min-height: 40px; padding: 0 var(--space-3); border: 1px solid var(--color-border-strong); border-radius: var(--radius); background: var(--color-surface); }
textarea { width: 100%; padding: var(--space-3); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; }

.form { padding: var(--space-4) var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: var(--space-1); flex: 1 1 240px; }
.field.grow { flex: 3 1 360px; }
.field label, .flabel { font-size: var(--text-sm); font-weight: 500; }
.field.wide { flex-basis: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--color-surface); box-shadow: 0 0 0 1px var(--color-border); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--color-text); }
.swatch:focus-visible { box-shadow: 0 0 0 2px var(--color-text), var(--shadow-focus); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.toolbar .spacer { flex: 1; }
.inline { display: inline-flex; align-items: center; gap: var(--space-2); }
.inline input { width: 170px; min-height: 44px; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.paste { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
.review ul, .errors ul { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-2); }
.review li, .errors li, .ok, .note { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--text-sm); }
.review li .ico, .errors li .ico, .ok .ico, .note .ico { margin-top: 3px; }
.errors { padding: var(--space-4) var(--space-6); }
.errors h2 { font-size: var(--text-md); }

.editor-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--space-4); align-items: start; }
.grid-wrap { overflow-x: auto; padding: var(--space-2); }
.grid { border-collapse: collapse; width: 100%; min-width: 1370px; table-layout: fixed; }
.grid th { text-align: left; font-size: var(--text-xs); font-weight: 500; color: var(--color-text-muted); padding: var(--space-2); white-space: nowrap; }
.grid td { padding: 2px; }
.grid input, .grid select { width: 100%; min-height: 36px; padding: 0 var(--space-2); border-color: transparent; border-radius: 6px; font-size: var(--text-sm); background: transparent; }
.grid tr:hover input, .grid tr:hover select { border-color: var(--color-border); }
.grid input:focus, .grid select:focus { border-color: var(--color-border-strong); background: var(--color-surface); }
.grid tbody tr { border-top: 1px solid var(--color-subtle); }
.grid tr.has-error td:first-child { box-shadow: inset 3px 0 0 var(--color-primary-strong); }
.c-id { width: 64px; } .c-type { width: 116px; } .c-ref { width: 160px; } .c-title { width: 180px; } .c-desc { width: 250px; } .c-tag { width: 130px; } .c-dep { width: 150px; } .c-exits { width: 150px; } .c-del { width: 40px; }
.th-cat { display: inline-flex; align-items: center; gap: 2px; }
.th-cat .icon-btn { width: 22px; height: 22px; font-size: 14px; }
.hint { padding: var(--space-3) var(--space-2) var(--space-2); font-size: 13px; }
.preview { padding: var(--space-4); position: sticky; top: var(--space-4); }
.preview h2 { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-2); }
.preview .diagram { max-height: 70vh; padding-bottom: var(--space-4); }

.phases { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.phases button { min-height: 44px; display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4) 0 var(--space-2); border: 1px solid var(--color-border); border-radius: 999px; background: var(--color-surface); color: var(--color-text); font-size: var(--text-sm); font-weight: 500; cursor: pointer; }
.phases .num { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--color-border-strong); font-size: var(--text-xs); }
.phases button[aria-current] { border-color: var(--flow, var(--color-primary)); }
.phases button[aria-current] .num { background: var(--flow, var(--color-primary)); border-color: var(--flow, var(--color-primary)); color: var(--flow-on, var(--color-on-primary)); }
.phases button:disabled { cursor: not-allowed; color: var(--color-text-dim); background: transparent; }

.cols { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: stretch; }
.diagram-card { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; position: relative; }
/* Step actions float in the bottom right corner of the diagram card. */
.actions { position: absolute; left: var(--space-4); right: var(--space-4); bottom: var(--space-4); z-index: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--space-3); pointer-events: none; }
.actions > * { pointer-events: auto; }
.actions .btn { min-width: 128px; box-shadow: 0 1px 4px rgba(17, 17, 17, 0.16); }
.actions .btn:focus-visible { box-shadow: var(--shadow-focus); }
.actions .msg { max-width: 360px; min-height: 0; margin-right: auto; padding: var(--space-2) var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: 0 1px 4px rgba(17, 17, 17, 0.16); }
.actions .msg:empty { display: none; }
.side { flex: 1 1 340px; max-width: 100%; padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.diagram { overflow: auto; max-height: 76vh; padding: var(--space-4) var(--space-4) 88px; }
.diagram svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.progress, .filter { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); }
.bar { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--color-subtle); overflow: hidden; }
.bar div { height: 6px; background: var(--flow, var(--color-primary)); transition: width 0.2s; }
.filter label { font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip, .chip-btn { display: inline-flex; align-items: center; padding: 4px 12px; border: 1px solid var(--color-border); border-radius: 999px; font-size: var(--text-sm); background: var(--color-surface); color: var(--color-text); }
.chip-btn { min-height: 36px; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }

.eyebrow { font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.08em; color: var(--color-text-muted); }
.step-title { font-size: var(--text-xl); line-height: 1.25; }
.desc { font-size: var(--text-md); }
.tags { display: flex; flex-direction: column; gap: var(--space-2); }
.tags div { display: flex; align-items: baseline; gap: var(--space-3); }
.tags dt { flex: 0 0 104px; font-size: var(--text-sm); color: var(--color-text-muted); }
.tags dd { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.exits { display: flex; flex-direction: column; gap: var(--space-2); }
.label { font-size: var(--text-sm); font-weight: 500; }
.exit-row { font-size: var(--text-sm); }
.btn.branch { text-align: left; font-weight: 400; font-size: 15px; border-color: var(--flow, var(--color-primary)); background: var(--flow-tint, var(--color-primary-tint)); padding: var(--space-2) var(--space-4); }
.btn.branch strong, .exit-row strong { font-weight: 500; }
.btn.branch { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.btn.branch.seen { border-color: var(--color-border-strong); background: var(--color-surface); }
.seen-tag .ico { margin-right: 0; }
.seen-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-muted); }
.note { padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg); }
.nav { margin-top: auto; display: flex; gap: var(--space-3); padding-top: var(--space-4); }
.nav .btn { flex: 1; }

/* Diagram marks read the same tokens. */
.edge { fill: none; stroke-width: 1.5; }
.edge.soft { stroke: var(--color-edge); }
.edge.strong { stroke: var(--flow-strong, var(--color-edge-strong)); }
.arrow.soft { fill: var(--color-edge); }
.arrow.strong { fill: var(--flow-strong, var(--color-edge-strong)); }
.elabel { font-size: 12.5px; font-weight: 500; paint-order: stroke; stroke: var(--color-surface); stroke-width: 4px; stroke-linejoin: round; }
.elabel.soft { fill: var(--color-text-dim); }
.elabel.strong { fill: var(--color-text); }
.node .shape { fill: var(--color-surface); stroke: var(--flow-strong, var(--color-edge-strong)); stroke-width: 1.5; }
.node .ring { fill: none; stroke: none; }
.node .ntext { font-size: 13px; fill: var(--color-text); }
.node .nicon { fill: var(--flow-strong, var(--color-edge-strong)); }
.node .shape2 { fill: none; stroke: var(--flow-strong, var(--color-edge-strong)); stroke-width: 1; }
.node.t-end .shape { stroke-width: 3; }
.node.t-link .shape { stroke-dasharray: 5 4; }
.node.dim .shape, .node.dim .shape2 { stroke: var(--color-edge); }
.node.dim .ntext { fill: var(--color-text-dim); }
.node.dim .nicon { fill: var(--color-text-dim); }
.node.visited .shape { fill: var(--flow-visited, var(--color-primary-tint)); }
.node.current .shape, .node.hit .shape { fill: var(--flow, var(--color-primary)); stroke: var(--flow, var(--color-primary)); stroke-dasharray: none; }
.node.current .ntext, .node.hit .ntext { fill: var(--flow-on, var(--color-on-primary)); font-weight: 500; }
.node.current .nicon, .node.hit .nicon { fill: var(--flow-on, var(--color-on-primary)); }
.node.current .shape2, .node.hit .shape2 { stroke: var(--flow-on, var(--color-on-primary)); }
/* The active step (current in the tour, selected in the review) is marked by a shadow, not a ring. */
.node.current, .node.selected { filter: var(--shadow-focus-svg); }
.node.clickable { cursor: pointer; }
.node.clickable:hover .shape { stroke-width: 2.5; }
.node:focus, .node:focus-visible { outline: none; box-shadow: none; }
.node:focus-visible { filter: var(--shadow-focus-svg); }
.badge rect { stroke-width: 1.5; }
.badge text { font-size: 13px; font-weight: 500; }
.badge.c1 rect { fill: var(--color-cat-1-bg); stroke: var(--color-cat-1-border); } .badge.c1 text { fill: var(--color-cat-1-text); }
.badge.c2 rect { fill: var(--color-cat-2-bg); stroke: var(--color-cat-2-border); } .badge.c2 text { fill: var(--color-cat-2-text); }
.badge.c3 rect { fill: var(--color-cat-3-bg); stroke: var(--color-cat-3-border); stroke-dasharray: 4 3; } .badge.c3 text { fill: var(--color-cat-3-text); }
.badge.c4 rect { fill: var(--color-cat-4-bg); stroke: var(--color-cat-4-border); } .badge.c4 text { fill: var(--color-cat-4-text); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); }
.lg { display: inline-flex; align-items: center; gap: var(--space-2); }
.sw { width: 28px; height: 16px; border-radius: 4px; border: 1.5px solid; }
.sw.c1 { background: var(--color-cat-1-bg); border-color: var(--color-cat-1-border); }
.sw.c2 { background: var(--color-cat-2-bg); border-color: var(--color-cat-2-border); }
.sw.c3 { background: var(--color-cat-3-bg); border-color: var(--color-cat-3-border); border-style: dashed; }
.sw.c4 { background: var(--color-cat-4-bg); border-color: var(--color-cat-4-border); }

.flowbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); font-size: var(--text-sm); }
.flowbar label { font-weight: 500; }
.flowbar select { min-height: 44px; min-width: 240px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-6); border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); }
.crumb { min-height: 36px; padding: 0 var(--space-2); border: none; border-radius: 6px; background: transparent; color: var(--color-primary-mid); text-decoration: underline; cursor: pointer; }
.crumb:hover { background: var(--color-subtle); }
.crumb.here { display: inline-flex; align-items: center; font-weight: 500; text-decoration: none; cursor: default; color: var(--color-text); }
.subinfo { font-size: var(--text-sm); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); }

@media (max-width: 1100px) {
  .editor-cols { grid-template-columns: minmax(0, 1fr); }
  .preview { position: static; }
}
.zoom-btn { display: none; min-height: 36px; padding: 0 var(--space-3); }

/* Phones: the step panel and its actions sit above the diagram, in a compact form. */
@media (max-width: 760px) {
  .page { padding: var(--space-4) var(--space-3) var(--space-8); gap: var(--space-3); }
  .top-in { padding: var(--space-2) var(--space-3); }
  h1 { font-size: 22px; }
  .cols { gap: var(--space-3); }
  .side { order: -1; flex-basis: 100%; padding: var(--space-4); gap: var(--space-2); }
  .side .eyebrow { font-size: 11px; }
  .step-title { font-size: var(--text-lg); }
  .desc { font-size: 15px; line-height: 1.4; }
  .side .exits.info, .side .subinfo { display: none; }
  .tags { flex-direction: row; flex-wrap: wrap; gap: var(--space-2); }
  .tags div { gap: var(--space-1); }
  .tags dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .chip { padding: 2px 10px; font-size: 13px; }
  .note { padding: var(--space-2) var(--space-3); font-size: 13px; }
  .msg { min-height: 0; }
  .nav { margin-top: 0; padding-top: var(--space-2); gap: var(--space-2); }
  .btn.branch { font-size: var(--text-sm); }
  .diagram { max-height: 60vh; padding: var(--space-2) var(--space-2) 84px; }
  .actions { left: var(--space-3); right: var(--space-3); bottom: var(--space-3); gap: var(--space-2); }
  .actions .btn { min-width: 0; flex: 1 1 120px; }

<script>

    decision: 'decision', espera: 'wait', wait: 'wait', subflujo: 'subflow', subflow: 'subflow', enlace: 'link', link: 'link', fin: 'end', end: 'end'

  var EXAMPLE = {

    categories: ['Responsable', 'Herramienta'],

      { id: 'P7', type: 'end', title: 'Pedido cerrado', description: '', tags: { Responsable: '', Herramienta: '' }, exits: '' }
    ]

  var EXAMPLE_SUB = {

    steps: [

    ]

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
  }

  function parseExits(text) {
    return String(text || '').split(/[|;]/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) {
      var i = p.lastIndexOf(':');
      if (i === -1) return { label: '', to: p };
      return { label: p.slice(0, i).trim(), to: p.slice(i + 1).trim() };
    });
  }

  function formatExits(exits) {
    return exits.map(function (e) { return e.label ? e.label + ':' + e.to : e.to; }).join(' | ');
  }

  /* "Depends on" is the incoming view of the same connections that "exits" stores. */
  function predecessorsText(draft, id) {
    id = String(id || '').trim();
    if (!id) return '';
    var out = [];
    draft.steps.forEach(function (s) {
      var sid = String(s.id || '').trim();
      parseExits(s.exits).forEach(function (e) { if (e.to === id && sid) out.push({ label: e.label, to: sid }); });
    });
    return formatExits(out);
  }

  /* Rewrites the predecessors' exits so that exactly the listed steps lead to the step in `row`. */
  function applyDependsOn(draft, row, text) {
    var target = draft.steps[row]; var res = { unknown: [], noId: false };
    var id = target ? String(target.id || '').trim() : '';
    if (!id) { res.noId = true; return res; }
    var wanted = new Map();
    parseExits(text).forEach(function (w) { if (w.to !== id) wanted.set(w.to, w.label); });
    var known = new Set(draft.steps.map(function (s) { return String(s.id || '').trim(); }));
    wanted.forEach(function (_, pid) { if (!known.has(pid)) res.unknown.push(pid); });
    if (res.unknown.length) return res; // nothing is changed when an ID is wrong
    draft.steps.forEach(function (s) {
      var sid = String(s.id || '').trim();
      var exits = parseExits(s.exits); var has = false;
      exits = exits.filter(function (e) {
        if (e.to !== id) return true;

        has = true; if (wanted.get(sid)) e.label = wanted.get(sid);

      });
      if (wanted.has(sid) && !has && sid) exits.push({ label: wanted.get(sid), to: id });
      s.exits = formatExits(exits);
    });
    return res;
  }

  function parseTags(text) {
    return String(text || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  /* Turns the editable draft (raw strings) into the structured flow. */
  function compile(draft) {
    var cats = (draft.categories || []).slice();
    return {
      name: String(draft.name || '').trim(),
      objective: String(draft.objective || '').trim(),
      categories: cats,
      steps: (draft.steps || []).map(function (s) {
        var tags = {};
        cats.forEach(function (c) { tags[c] = parseTags(s.tags && s.tags[c]); });
        return {
          id: String(s.id || '').trim(), type: s.type, title: String(s.title || '').trim(),
          description: String(s.description || '').trim(), tags: tags, exits: parseExits(s.exits),
          ref: s.type === 'subflow' ? String(s.ref || '') : ''

  }

  function validate(flow) {
    var errors = [];
    var ids = new Map();
    var ref = function (s, i) { return s.id ? 'Paso ' + s.id : 'Fila ' + (i + 1); };
    if (!flow.name) errors.push({ row: null, message: 'El flujo no tiene nombre.' });
    if (!flow.steps.length) errors.push({ row: null, message: 'El flujo no tiene pasos.' });
    flow.steps.forEach(function (s, i) {
      if (!s.id) errors.push({ row: i, message: 'Fila ' + (i + 1) + ': falta el ID.' });
      else if (ids.has(s.id)) errors.push({ row: i, message: 'Fila ' + (i + 1) + ': el ID «' + s.id + '» está repetido.' });
      else ids.set(s.id, s);
      if (!s.title) errors.push({ row: i, message: ref(s, i) + ': falta el título.' });
      if (TYPES.indexOf(s.type) === -1) errors.push({ row: i, message: ref(s, i) + ': el tipo no es válido.' });
    });
    flow.steps.forEach(function (s, i) {
      s.exits.forEach(function (e) {
        if (!ids.has(e.to)) errors.push({ row: i, message: ref(s, i) + ': la salida apunta a «' + e.to + '», que no existe.' });
      });
      if (s.type === 'decision') {
        if (s.exits.length < 2) errors.push({ row: i, message: ref(s, i) + ': una decisión necesita al menos dos salidas.' });
        if (s.exits.some(function (e) { return !e.label; })) errors.push({ row: i, message: ref(s, i) + ': cada salida de una decisión necesita rótulo (ej. Sí:P5 | No:P4).' });
      }
      if (s.type !== 'end' && s.exits.length === 0) errors.push({ row: i, message: ref(s, i) + ': no tiene salida y no es de tipo Fin.' });
    });

    var seen = new Set();
    var stack = starts.map(function (s) { return s.id; });
    while (stack.length) {
      var id = stack.pop();
      if (seen.has(id) || !ids.has(id)) continue;
      seen.add(id);
      ids.get(id).exits.forEach(function (e) { stack.push(e.to); });
    }
    if (starts.length) {
      flow.steps.forEach(function (s, i) {
        if (s.id && ids.get(s.id) === s && !seen.has(s.id)) errors.push({ row: i, message: ref(s, i) + ': no es alcanzable desde ningún inicio.' });
      });
    }
    return errors;
  }

  /* Checks subflow references. `lib(id)` returns { name, published } for a flow, or null. */
  function validateRefs(flow, selfId, lib) {
    var errors = [];
    var reaches = function (from, seen) {
      if (from === selfId) return true;
      if (seen.has(from)) return false;
      seen.add(from);
      var f = lib(from);
      if (!f || !f.published) return false;
      return f.published.steps.some(function (s) { return s.type === 'subflow' && s.ref && reaches(s.ref, seen); });
    };

      if (s.type !== 'subflow') return;
      var ref = s.id ? 'Paso ' + s.id : 'Fila ' + (i + 1);
      var f = s.ref ? lib(s.ref) : null;
      if (!s.ref) errors.push({ row: i, message: ref + ': elige cuál es el subflujo.' });
      else if (!f) errors.push({ row: i, message: ref + ': el subflujo ya no existe.' });
      else if (s.ref === selfId) errors.push({ row: i, message: ref + ': un flujo no puede ser subflujo de sí mismo.' });
      else if (!f.published) errors.push({ row: i, message: ref + ': el subflujo «' + f.name + '» aún no está publicado.' });
      else if (reaches(s.ref, new Set())) errors.push({ row: i, message: ref + ': «' + f.name + '» ya contiene este flujo; no pueden incluirse mutuamente.' });
    });
    return errors;
  }

  /* Parses cells pasted from a spreadsheet (tab separated, header row first). */
  function parseTable(text, resolveFlow) {

    var head = lines[0].split('\t').map(function (h) { return h.trim(); });

        '<td><select data-r="' + r + '" data-f="type" aria-label="Tipo del ' + esc(n) + '">' + typeOptions(s.type) + '</select></td>' +
        '<td><select data-r="' + r + '" data-f="ref" aria-label="Subflujo del ' + esc(n) + '"' + (s.type === 'subflow' ? '' : ' disabled') + '>' + refOptions(s.type === 'subflow' ? s.ref : '') + '</select></td>' +
        cell(r, 'title', s.title, 'Título del ' + n) + cell(r, 'description', s.description, 'Descripción del ' + n);
      d.categories.forEach(function (c) { h += cell(r, 'tag', (s.tags && s.tags[c]) || '', c + ' del ' + n, c); });
      h += cell(r, 'dep', C.predecessorsText(d, s.id), 'Pasos de los que depende el ' + n) + cell(r, 'exits', s.exits, 'Salidas del ' + n) +
        '<td><button type="button" class="icon-btn" data-delrow="' + r + '" aria-label="Quitar el ' + esc(n) + '">' + ico('close', 12) + '</button></td></tr>';
    });
    return h + '</tbody></table>';
  }
  function pasteHTML() {
    var h = '<div class="card paste"><h2>Pegar desde Excel</h2>' +
      '<p class="muted">Copia las celdas en Excel, con la fila de encabezados, y pégalas aquí. Columnas: ID, Tipo, Subflujo, Título, Descripción, Depende de, Salidas. Cualquier otra columna se toma como categoría.</p>' +
      '<label class="sr" for="pasteText">Celdas pegadas</label><textarea id="pasteText" rows="6" spellcheck="false">' + esc(ui.pasteText) + '</textarea>';
    var r = ui.pasteResult;
    if (r) {
      h += '<div class="review"><p><strong>' + r.steps.length + (r.steps.length === 1 ? ' paso' : ' pasos') + '</strong>' +
        (r.categories.length ? ' · categorías: ' + esc(r.categories.join(', ')) : ' · sin categorías') + '</p>';
      if (r.errors.length) h += '<ul>' + r.errors.map(function (e) { return '<li>' + ALERT + '<span>' + esc(e) + '</span></li>'; }).join('') + '</ul>';
      h += '</div>';
    }
    h += '<div class="row"><button type="button" class="btn" id="pasteReview">Revisar</button>';
    if (r && r.steps.length) h += '<button type="button" class="btn primary" id="pasteApply">Reemplazar la tabla</button>';
    return h + '<button type="button" class="btn ghost" id="pasteCancel">Cancelar</button></div></div>';
  }

  function renderEditor() {
    var d = D();
    var cur = flowColor(state.current);
    var h = '<section class="page" style="' + themeVars(cur) + '">' + flowBarHTML(true) + '<div class="page-head"><div><h1>Editar flujo</h1><p class="muted">Llena la tabla. El diagrama se dibuja solo.</p></div>' +
      '<div class="pub"><span id="pubState" class="status"></span><button type="button" class="btn primary" id="publish">Publicar</button></div></div>' +
      '<p id="editMsg" class="msg" role="status">' + esc(ui.editMsg) + '</p>' +
      '<div class="card form"><div class="field"><label for="fName">Nombre</label><input id="fName" type="text" value="' + esc(d.name) + '"></div>' +
      '<div class="field grow"><label for="fObj">Objetivo (opcional)</label><input id="fObj" type="text" value="' + esc(d.objective) + '"></div>' +
      '<div class="field wide"><span class="flabel" id="colLabel">Color del flujo</span><div class="swatches" role="group" aria-labelledby="colLabel">' + FLOW_COLORS.map(function (col, i) {
        return '<button type="button" class="swatch" data-color="' + col + '" aria-pressed="' + (col === cur) + '" aria-label="Color ' + (i + 1) + '" style="background:' + col + '"></button>';
      }).join('') + '</div></div></div>' +
      '<div class="toolbar"><button type="button" class="btn" id="addRow">Agregar paso</button>' +
      '<button type="button" class="btn" id="togglePaste">Pegar desde Excel</button>' +
      '<button type="button" class="btn" id="copyTable">Copiar tabla</button>' +
      '<span class="inline"><label class="sr" for="newCat">Nueva categoría</label><input id="newCat" type="text" placeholder="Nueva categoría"><button type="button" class="btn" id="addCat">Agregar</button></span>' +
      '<span class="spacer"></span>';
    h += ui.confirmReset
      ? '<span class="inline"><span class="muted">¿Reemplazar todos los flujos por el ejemplo?</span><button type="button" class="btn" id="resetYes">Sí, reemplazar</button><button type="button" class="btn ghost" id="resetNo">No</button></span>'
      : '<button type="button" class="btn ghost" id="resetAsk">Restaurar ejemplo</button>';
    h += '</div>' + (ui.pasteOpen ? pasteHTML() : '') +
      '<div class="editor-cols"><div class="card grid-wrap">' + gridHTML() +
      '<p class="hint muted">Conecta los pasos por cualquiera de los dos lados: en <strong>Depende de</strong> escribe el ID del paso anterior, o en <strong>Salidas</strong> el del siguiente. La otra columna se actualiza sola. Con varias, sepáralas con | y rotúlalas: <code>Sí:P5 | No:P4</code>. Etiquetas: separa varios valores con coma. Un paso de tipo <strong>Subflujo</strong> contiene otro flujo ya publicado.</p></div>' +
      '<div class="card preview"><h2>Vista previa</h2><div id="preview" class="diagram"></div></div></div>' +
      '<div id="errors" class="card errors" role="status"></div></section>';
    app.innerHTML = h;
    refreshEditor();
  }

  function refreshEditor() {
    var flow = C.compile(D());
    var errs = C.validate(flow).concat(C.validateRefs(flow, state.current, lib));
    ui.errs = errs;
    var box = $('errors');
    if (box) {
      box.innerHTML = errs.length
        ? '<h2>Para publicar, corrige ' + errs.length + (errs.length === 1 ? ' problema' : ' problemas') + '</h2><ul>' +
          errs.map(function (e) { return '<li>' + ALERT + '<span>' + esc(e.message) + '</span></li>'; }).join('') + '</ul>'
        : '<p class="ok">' + CHECK + '<span>La tabla es válida y se puede publicar.</span></p>';
    }
    var bad = new Set(errs.map(function (e) { return e.row; }));
    Array.prototype.forEach.call(app.querySelectorAll('tr[data-row]'), function (tr) {
      tr.classList.toggle('has-error', bad.has(Number(tr.getAttribute('data-row'))));
    });
    var pv = $('preview');
    if (pv) drawDiagram(pv, flow);
    var ps = $('pubState');
    if (ps) {
      var p = pub(state.current);
      ps.innerHTML = !p ? DOT + '<span>Sin publicar</span>'
        : JSON.stringify(flow) !== JSON.stringify(p) ? DOT + '<span>Cambios sin publicar</span>' : CHECK + '<span>Publicado</span>';
    }
    save();
  }
  function scheduleRefresh() {
    clearTimeout(ui.debounce);
    ui.debounce = setTimeout(refreshEditor, 200);
  }
  function setEditMsg(t) { ui.editMsg = t; var m = $('editMsg'); if (m) m.textContent = t; }

  function nextId() {
    var max = 0;
    D().steps.forEach(function (s) { var m = /^P(\d+)$/.exec(s.id || ''); if (m) max = Math.max(max, Number(m[1])); });
    return 'P' + (max + 1);
  }

  function publish() {
    clearTimeout(ui.debounce);
    refreshEditor();
    if (ui.errs.length) {
      setEditMsg('No se publicó: corrige los problemas de la lista.');
      var box = $('errors'); if (box && box.scrollIntoView) box.scrollIntoView({ block: 'nearest' });
      return;
    }
    state.flows[state.current].published = C.compile(D());
    resetTour();
    save();
    refreshEditor();
    setEditMsg('Publicado. Ábrelo en «Ver flujo».');
  }

  function editorClick(t) {
    var b = t.closest('button'); if (!b) return;
    var d = D();
    if (b.hasAttribute('data-color')) { state.flows[state.current].color = b.getAttribute('data-color'); save(); return renderEditor(); }
    if (b.hasAttribute('data-delrow')) { d.steps.splice(Number(b.getAttribute('data-delrow')), 1); ui.editMsg = ''; return renderEditor(); }
    if (b.hasAttribute('data-delcat')) {
      var name = d.categories.splice(Number(b.getAttribute('data-delcat')), 1)[0];
      d.steps.forEach(function (s) { if (s.tags) delete s.tags[name]; });
      return renderEditor();
    }
    switch (b.id) {
      case 'newFlow':
        var id = 'f' + Date.now().toString(36);
        state.flows[id] = {
          draft: {
            name: 'Nuevo flujo', objective: '', categories: d.categories.slice(),
            steps: [{ id: 'P1', type: 'start', title: 'Inicio', description: '', tags: {}, exits: 'P2' }, { id: 'P2', type: 'end', title: 'Fin', description: '', tags: {}, exits: '' }]
          }, published: null,
          color: FLOW_COLORS.filter(function (col) { return !state.order.some(function (fid) { return state.flows[fid].color === col; }); })[0] || FLOW_COLORS[state.order.length % FLOW_COLORS.length]
        };
        state.order.push(id); state.current = id; resetTour();
        ui.editMsg = 'Flujo creado. Ponle nombre, llena la tabla y publícalo.';
        renderEditor(); var nm = $('fName'); if (nm) { nm.focus(); nm.select(); }
        break;
      case 'addRow':
        d.steps.push({ id: nextId(), type: 'activity', title: '', description: '', tags: {}, exits: '' });
        renderEditor();
        var inp = app.querySelector('input[data-r="' + (d.steps.length - 1) + '"][data-f="title"]'); if (inp) inp.focus();
        break;
      case 'addCat':
        var v = ($('newCat').value || '').trim();
        if (!v) { setEditMsg('Escribe el nombre de la categoría.'); break; }
        if (d.categories.some(function (c) { return C.norm(c) === C.norm(v); })) { setEditMsg('Esa categoría ya existe.'); break; }
        d.categories.push(v); ui.editMsg = ''; renderEditor();
        break;
      case 'togglePaste': ui.pasteOpen = !ui.pasteOpen; ui.pasteResult = null; renderEditor(); if (ui.pasteOpen && $('pasteText')) $('pasteText').focus(); break;
      case 'pasteReview':
        ui.pasteText = $('pasteText').value;
        ui.pasteResult = C.parseTable(ui.pasteText, function (nameText) {
          var hit = state.order.filter(function (fid) { return fid !== state.current && C.norm(flowName(fid)) === C.norm(nameText); });
          return hit.length ? hit[0] : null;
        });
        renderEditor();
        break;
      case 'pasteApply':
        if (ui.pasteResult && ui.pasteResult.steps.length) {
          d.steps = ui.pasteResult.steps; d.categories = ui.pasteResult.categories;
          ui.pasteOpen = false; ui.pasteResult = null; ui.pasteText = '';
          ui.editMsg = 'Tabla reemplazada. Revisa el diagrama y publica.';
          renderEditor();
        }
        break;
      case 'pasteCancel': ui.pasteOpen = false; ui.pasteResult = null; ui.pasteText = ''; renderEditor(); break;
      case 'copyTable':
        var tsv = C.toTSV(d, flowName);
        var fallback = function () { ui.pasteOpen = true; ui.pasteText = tsv; ui.pasteResult = null; ui.editMsg = 'No se pudo copiar sola. Selecciona el texto y cópialo.'; renderEditor(); var ta = $('pasteText'); if (ta) { ta.focus(); ta.select(); } };
        try { navigator.clipboard.writeText(tsv).then(function () { setEditMsg('Tabla copiada. Pégala en Excel.'); }, fallback); } catch (e) { fallback(); }
        break;
      case 'resetAsk': ui.confirmReset = true; renderEditor(); break;
      case 'resetNo': ui.confirmReset = false; renderEditor(); break;
      case 'resetYes': state = initial(); resetTour(); ui.confirmReset = false; ui.editMsg = 'Ejemplo restaurado.'; renderEditor(); break;
      case 'publish': publish(); break;
    }
  }

  function editorInput(t) {
    var d = D();
    if (t.id === 'fName') { d.name = t.value; return scheduleRefresh(); }
    if (t.id === 'fObj') { d.objective = t.value; return scheduleRefresh(); }
    if (t.id === 'pasteText') { ui.pasteText = t.value; return; }
    var f = t.getAttribute('data-f'); if (!f || f === 'dep') return;
    var s = d.steps[Number(t.getAttribute('data-r'))]; if (!s) return;
    if (f === 'tag') { s.tags = s.tags || {}; s.tags[t.getAttribute('data-c')] = t.value; }
    else s[f] = t.value;
    if (f === 'type') {
      var refSel = app.querySelector('select[data-r="' + t.getAttribute('data-r') + '"][data-f="ref"]');
      if (refSel) { refSel.disabled = s.type !== 'subflow'; if (s.type !== 'subflow') refSel.value = ''; else refSel.value = s.ref || ''; }
    }
    if (f === 'exits' || f === 'id') syncEdgeCells();
    scheduleRefresh();
  }

  /* Keeps "Depende de" and "Salidas" in step: both show the same connections. */
  function syncEdgeCells() {
    var d = D();
    Array.prototype.forEach.call(app.querySelectorAll('input[data-f="exits"], input[data-f="dep"]'), function (el) {
      var s = d.steps[Number(el.getAttribute('data-r'))]; if (!s) return;
      var isDep = el.getAttribute('data-f') === 'dep';
      if (!isDep && el === document.activeElement) return;
      el.value = isDep ? C.predecessorsText(d, s.id) : s.exits;
    });
  }
  function editorDepChange(t) {
    var res = C.applyDependsOn(D(), Number(t.getAttribute('data-r')), t.value);
    syncEdgeCells();
    setEditMsg(res.noId ? 'Ponle primero un ID al paso.'
      : res.unknown.length ? 'No existe el paso «' + res.unknown.join('», «') + '». No se cambió nada.' : '');
    scheduleRefresh();
  }

  /* ---------- Viewer ---------- */

  function resetTour() { ui.session = null; ui.elapsed = 0; ui.phase = 'overview'; ui.notice = ''; ui.selected = null; ui.hlCat = ''; ui.hlVal = ''; ui.revStack = []; }
  function startTour() {
    var root = state.current;
    ui.session = { root: root, tours: {}, stack: [root], done: new Set() };
    ui.session.tours[root] = new C.Tour(pub(root));
    ui.elapsed = 0; ui.notice = ''; ui.phase = 'tour';
  }
  function top(stack) { return stack[stack.length - 1]; }
  function progress() {
    var se = ui.session; var total = 0, seen = 0;
    closure(se.root).forEach(function (id) {
      var n = pub(id).steps.length; total += n;
      seen += se.done.has(id) ? n : (se.tours[id] ? se.tours[id].visited.size : 0);
    });
    return { total: total, seen: seen };
  }
  function syncTimer() {
    var run = route() === 'ver' && ui.phase === 'tour' && !!ui.session;
    if (run && !ui.timer) ui.timer = setInterval(function () { ui.elapsed++; }, 1000);
    else if (!run && ui.timer) { clearInterval(ui.timer); ui.timer = null; }
  }
  function crumbsHTML(stack, attr) {
    if (stack.length < 2) return '';
    return '<nav class="crumbs" aria-label="Ubicación">' + stack.map(function (id, i) {
      return i < stack.length - 1
        ? '<button type="button" class="crumb" ' + attr + '="' + i + '">' + esc(flowName(id)) + '</button><span aria-hidden="true">›</span>'
        : '<span class="crumb here" aria-current="location">' + esc(flowName(id)) + '</span>';
    }).join('') + '</nav>';
  }

  function detailsHTML(s, flow) {
    var h = '<p class="eyebrow">' + esc((C.TYPE_LABELS[s.type] || '').toUpperCase()) + '</p><h2 class="step-title">' + esc(s.title) + '</h2>' +
      (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '<p class="muted">Este paso no tiene descripción.</p>');
    if (s.type === 'subflow' && s.ref && pub(s.ref)) {
      var n = pub(s.ref).steps.length;
      h += '<p class="subinfo">Contiene el flujo «' + esc(flowName(s.ref)) + '» · ' + n + (n === 1 ? ' paso' : ' pasos') + '</p>';
    }
    var rows = flow.categories.filter(function (c) { return s.tags[c] && s.tags[c].length; });
    if (rows.length) {
      h += '<dl class="tags">' + rows.map(function (c) {
        return '<div><dt>' + esc(c) + '</dt><dd>' + s.tags[c].map(function (v) { return '<span class="chip">' + esc(v) + '</span>'; }).join('') + '</dd></div>';
      }).join('') + '</dl>';
    }
    return h;
  }

  function renderViewer() {
    var f = pub(state.current);
    if (!f) {
      app.innerHTML = '<section class="page" style="' + themeVars(flowColor(state.current)) + '">' + flowBarHTML(false) + '<div class="card pad"><h1>' + esc(flowName(state.current)) + '</h1><p class="muted">Este flujo aún no se ha publicado. Publícalo desde «Editar» para verlo aquí.</p></div></section>';
      return syncTimer();
    }
    var rev = isReviewed();
    if (ui.phase === 'review' && !rev) ui.phase = 'overview';
    if (ui.phase === 'tour' && !ui.session) startTour();
    var tab = function (k, n, label, disabled) {
      return '<li><button type="button" data-phase="' + k + '"' + (ui.phase === k ? ' aria-current="step"' : '') + (disabled ? ' disabled' : '') + '><span class="num">' + n + '</span>' + label + '</button></li>';
    };
    var status = rev ? CHECK + '<span>Revisado</span>' : ui.session ? GEAR + '<span>Recorrido en curso</span>' : DOT + '<span>Pendiente de revisión</span>';
    app.innerHTML = '<section class="page" style="' + themeVars(flowColor(state.current)) + '">' + flowBarHTML(false) + '<div class="page-head"><div><h1><span class="flow-dot" aria-hidden="true"></span>' + esc(f.name) + '</h1>' +
      (f.objective ? '<p class="muted">' + esc(f.objective) + '</p>' : '') + '</div><span class="status">' + status + '</span></div>' +
      '<ol class="phases">' + tab('overview', 1, 'Panorama') + tab('tour', 2, 'Recorrido') + tab('review', 3, rev ? 'Repaso' : 'Repaso · se desbloquea al terminar el recorrido', !rev) + '</ol>' +
      '<div id="phase"></div></section>';
    renderPhase();
  }

  function renderPhase(focusId) {
    var box = $('phase'); if (!box) return;
    var h; var dg; var f;
    var depth = ui.phase === 'tour' && ui.session ? ui.session.stack.length - 1 : ui.phase === 'review' ? Math.max(0, ui.revStack.length - 1) : 0;
    box.style.cssText = themeVars(shade(flowColor(state.current), depth));
    if (ui.phase === 'overview') {
      f = pub(state.current);
      var subs = closure(state.current).length - 1; var pr = 0;
      closure(state.current).forEach(function (id) { pr += pub(id).steps.length; });
      var label = isReviewed() ? 'Repetir recorrido' : (ui.session ? 'Continuar recorrido' : 'Iniciar recorrido');
      box.innerHTML = '<div class="cols"><div class="card diagram-card"><div id="dg" class="diagram"></div>' +
        '<div class="actions"><button type="button" class="btn primary" id="startTour">' + label + '</button></div></div>' +
        '<aside class="card side"><p class="eyebrow">PANORAMA</p><h2 class="step-title">El flujo completo</h2>' +
        '<p class="desc">Míralo de arriba abajo para ubicarte. Después lo recorrerás un paso a la vez.</p>' +
        '<p class="muted">' + pr + ' pasos' + (subs ? ', contando ' + subs + (subs === 1 ? ' subflujo' : ' subflujos') + ' que verás por dentro al llegar a ' + (subs === 1 ? 'él' : 'ellos') + '.' : '') + '</p></aside></div>';
      drawDiagram($('dg'), f);
    } else if (ui.phase === 'tour') {
      var se = ui.session; var fid = top(se.stack); f = pub(fid);
      var t = se.tours[fid]; var cur = t.current(); var s = t.step(); var p = progress();
      var inSub = se.stack.length > 1;
      var isSub = s.type === 'subflow' && !!s.ref && !!pub(s.ref) && se.stack.indexOf(s.ref) === -1;
      var subDone = isSub && se.done.has(s.ref);
      var mustEnter = t.atEnd() && isSub && !subDone;
      h = '<div class="cols"><div class="card diagram-card"><div class="progress"><span>Pasos visitados: ' + p.seen + ' de ' + p.total + '</span>' +
        '<div class="bar" role="progressbar" aria-label="Pasos visitados" aria-valuemin="0" aria-valuemax="' + p.total + '" aria-valuenow="' + p.seen + '"><div style="width:' + Math.round(p.seen / p.total * 100) + '%"></div></div>' +
        '<button type="button" class="btn zoom-btn" id="zoomBtn">' + ico('zoom', 14) + (ui.zoom ? 'Ver todo' : 'Acercar') + '</button></div>' +
        crumbsHTML(se.stack, 'data-crumb') + legendHTML(f) + '<div id="dg" class="diagram"></div><!--ACTIONS--></div><aside class="card side">';
      if (cur.note && t.atEnd()) {
        var nt = cur.note; var ttl = function (id) { return '«' + esc(t.byId.get(id).title) + '»'; };
        var why = nt.endAt ? 'Esa rama terminó en ' + ttl(nt.endAt) + '. ' : nt.loopTo ? 'Ese camino se repite sin llegar a un cierre. ' : '';
        h += '<p class="note">' + why + (nt.returned ? 'Vuelves a esta decisión para ver las otras opciones.' : 'Ahora sigues con una parte del flujo que faltaba.') + '</p>';
      }
      h += detailsHTML(s, f);
      var opts = t.options(); var choice = t.needsChoice() && !mustEnter;
      var rowText = function (o) {
        return '<p class="exit-row">' + (o.label ? '<strong>' + esc(o.label) + '</strong> · ' : '') + esc(o.title) + (o.visited && t.atEnd() ? ' (ya visitado)' : '') + '</p>';
      };
      if (mustEnter) {
        h += '<div class="exits"><p class="label">Este paso tiene su propio flujo</p><p class="muted small">Lo recorrerás por dentro y volverás aquí para continuar.</p></div>';
      } else if (opts.length) {
        if (choice) {
          var anySeen = opts.some(function (o) { return o.taken; });
          h += '<div class="exits"><p class="label">Elige una rama para continuar</p>' + opts.map(function (o) {
            return '<button type="button" class="btn branch' + (o.taken ? ' seen' : '') + '" data-choose="' + o.index + '">' + (o.label ? '<strong>' + esc(o.label) + '</strong> · ' : '') + esc(o.title) + (o.taken ? '<span class="seen-tag">' + CHECK + 'Ya recorrida</span>' : '') + '</button>';
          }).join('') + (t.canSkip() ? '<button type="button" class="btn branch" id="skipBtn">Ir a lo que falta por visitar</button>' : '') +
            (anySeen ? '<p class="muted small">Puedes repetir una rama ya recorrida.</p>' : '') + '</div>';
        } else {
          h += '<div class="exits info"><p class="label">' + (opts.length === 1 ? 'Sigue con' : 'Salidas') + '</p>' + opts.map(rowText).join('') + '</div>';
        }
      }
      if (t.atEnd() && subDone) h += '<div class="exits"><button type="button" class="btn branch seen" id="repeatSub">Ver el subflujo otra vez<span class="seen-tag">' + CHECK + 'Ya recorrido</span></button></div>';
      var subEnd = inSub && t.canFinish();
      var finish = !inSub && t.canFinish();
      var primary = mustEnter ? '<button type="button" class="btn primary" id="enterBtn">Entrar al subflujo</button>'
        : subEnd ? '<button type="button" class="btn primary" id="backBtn">' + ico('back', 12) + 'Volver a «' + esc(flowName(se.stack[se.stack.length - 2])) + '»</button>'
        : finish ? '<button type="button" class="btn primary" id="finishBtn">Terminar recorrido</button>'
        : '<button type="button" class="btn primary" id="nextBtn"' + (choice ? ' disabled' : '') + '>Siguiente</button>';
      h += '</aside></div>';
      h = h.replace('<!--ACTIONS-->', '<div class="actions"><p id="tourMsg" class="msg" role="status">' + (ui.notice === 'time' ? esc(FAST_MSG) : '') + '</p>' +
        '<button type="button" class="btn" id="prevBtn"' + (t.pos === 0 ? ' disabled' : '') + '>Anterior</button>' + primary + '</div>');
      box.innerHTML = h;
      dg = $('dg');
      drawDiagram(dg, f, {
        badgesFor: cur.id,
        state: function (id) { return id === cur.id ? 'current' : (t.visited.has(id) ? 'visited' : 'dim'); },
        strong: function (e) { return t.visited.has(e.from) && t.visited.has(e.to); }
      });
      if (MOBILE.matches && ui.zoom) {
        var around = [cur.id].concat(opts.map(function (o) { return o.to; }));
        if (t.pos > 0) around.push(t.trail[t.pos - 1].id);
        zoomTo(dg, around, cur.id);
      } else scrollToNode(dg, cur.id);
    } else {
      if (!ui.revStack.length) ui.revStack = [state.current];
      f = pub(top(ui.revStack));
      var cat = f.categories.indexOf(ui.hlCat) !== -1 ? ui.hlCat : ''; var vals = [];
      if (cat) f.steps.forEach(function (st) { (st.tags[cat] || []).forEach(function (v) { if (vals.indexOf(v) === -1) vals.push(v); }); });
      if (vals.indexOf(ui.hlVal) === -1) ui.hlVal = '';
      var sel = ui.selected ? f.steps.filter(function (x) { return x.id === ui.selected; })[0] : null;
      var canOpen = sel && sel.type === 'subflow' && sel.ref && pub(sel.ref) && ui.revStack.indexOf(sel.ref) === -1;
      h = '<div class="cols"><div class="card diagram-card"><div class="filter"><label for="hlCat">Resaltar por</label><select id="hlCat"><option value="">Nada</option>' +
        f.categories.map(function (c) { return '<option value="' + esc(c) + '"' + (c === cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
        '<div class="chips">' + vals.map(function (v) { return '<button type="button" class="chip-btn" data-hlval="' + esc(v) + '" aria-pressed="' + (v === ui.hlVal) + '">' + esc(v) + '</button>'; }).join('') + '</div></div>' +
        crumbsHTML(ui.revStack, 'data-rcrumb') + legendHTML(f) + '<div id="dg" class="diagram"></div>' +
        (canOpen ? '<div class="actions"><button type="button" class="btn primary" id="openSub">' + ico('sub', 12) + 'Abrir subflujo</button></div>' : '') + '</div><aside class="card side">' +
        (ui.notice === 'done' ? '<p class="note">' + CHECK + '<span>Flujo revisado. En la aplicación real, esto habilita la evaluación.</span></p>' : '') +
        (sel ? detailsHTML(sel, f)
          : '<p class="eyebrow">REPASO</p><h2 class="step-title">Explora con libertad</h2><p class="desc">Haz clic en cualquier paso para ver su detalle, o resalta los pasos por etiqueta.</p>') +
        '</aside></div>';
      box.innerHTML = h;
      drawDiagram($('dg'), f, {
        clickable: true,
        badgesFor: ui.selected,
        state: function (id) {
          var st = f.steps.filter(function (x) { return x.id === id; })[0];
          var c = id === ui.selected ? 'selected ' : '';
          if (cat && ui.hlVal) c += (st.tags[cat] || []).indexOf(ui.hlVal) !== -1 ? 'hit' : 'dim';
          return c;
        }
      });
    }
    syncTimer();
    if (focusId) {
      var el = $(focusId) || box.querySelector('[data-choose]:not(.seen)') || $('enterBtn') || $('backBtn') || $('finishBtn') || $('nextBtn');
      if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    }
  }

  function selectNode(g) {
    ui.selected = g.getAttribute('data-id'); ui.notice = '';
    renderPhase();
    var again = app.querySelector('.node[data-id="' + (window.CSS && CSS.escape ? CSS.escape(ui.selected) : ui.selected) + '"]');
    if (again) { try { again.focus({ preventScroll: true }); } catch (e) { /* not focusable */ } }
  }

  function viewerClick(t) {
    var node = t.closest('.node.clickable');
    if (node && ui.phase === 'review') return selectNode(node);
    var b = t.closest('button'); if (!b || b.disabled) return;
    var se = ui.session; var tour = se ? se.tours[top(se.stack)] : null;
    if (b.hasAttribute('data-phase')) {
      var p = b.getAttribute('data-phase');
      if (p === 'review' && !isReviewed()) return;
      ui.phase = p; ui.notice = ui.notice === 'done' && p === 'review' ? 'done' : '';
      return renderViewer();
    }
    if (b.hasAttribute('data-choose')) { tour.choose(Number(b.getAttribute('data-choose'))); ui.notice = ''; return renderPhase('nextBtn'); }
    if (b.hasAttribute('data-hlval')) { var v = b.getAttribute('data-hlval'); ui.hlVal = ui.hlVal === v ? '' : v; return renderPhase(); }
    if (b.hasAttribute('data-crumb')) { se.stack.length = Number(b.getAttribute('data-crumb')) + 1; ui.notice = ''; return renderPhase('nextBtn'); }
    if (b.hasAttribute('data-rcrumb')) { ui.revStack.length = Number(b.getAttribute('data-rcrumb')) + 1; ui.selected = null; return renderPhase(); }
    var ref = tour ? tour.step().ref : '';
    switch (b.id) {
      case 'startTour':
        if (isReviewed() || !ui.session) startTour(); else ui.phase = 'tour';
        renderViewer(); var n = $('nextBtn'); if (n) n.focus();
        break;
      case 'nextBtn': tour.next(); ui.notice = ''; renderPhase('nextBtn'); break;
      case 'zoomBtn': ui.zoom = !ui.zoom; renderPhase('zoomBtn'); break;
      case 'skipBtn': tour.skip(); ui.notice = ''; renderPhase('nextBtn'); break;
      case 'prevBtn': tour.prev(); ui.notice = ''; renderPhase('prevBtn'); break;
      case 'enterBtn':
        if (!se.tours[ref]) se.tours[ref] = new C.Tour(pub(ref));
        se.stack.push(ref); ui.notice = ''; renderPhase('nextBtn');
        break;
      case 'repeatSub': se.tours[ref] = new C.Tour(pub(ref)); se.stack.push(ref); ui.notice = ''; renderPhase('nextBtn'); break;
      case 'backBtn': se.done.add(se.stack.pop()); ui.notice = ''; renderPhase('nextBtn'); break;
      case 'openSub':
        var sel = pub(top(ui.revStack)).steps.filter(function (x) { return x.id === ui.selected; })[0];
        if (sel && sel.ref && pub(sel.ref)) { ui.revStack.push(sel.ref); ui.selected = null; ui.hlVal = ''; renderPhase(); }
        break;
      case 'finishBtn':
        if (ui.elapsed < progress().total * SECONDS_PER_STEP) { ui.notice = 'time'; renderPhase('finishBtn'); break; }
        state.reviewed[state.current] = signature(state.current); save();
        ui.phase = 'review'; ui.notice = 'done'; ui.selected = null; ui.revStack = [state.current];
        renderViewer();
        break;
    }
  }

  /* ---------- Routing and events ---------- */

  function route() { return location.hash === '#editar' ? 'editar' : 'ver'; }
  function render() {
    var r = route();
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      if (a.getAttribute('data-nav') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (r === 'editar') { renderEditor(); syncTimer(); } else renderViewer();
  }

  app.addEventListener('click', function (ev) { if (route() === 'editar') editorClick(ev.target); else viewerClick(ev.target); });
  app.addEventListener('input', function (ev) { if (route() === 'editar' && ev.target.id !== 'flowSel') editorInput(ev.target); });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'flowSel') {
      clearTimeout(ui.debounce);
      state.current = t.value; resetTour(); ui.editMsg = ''; ui.pasteOpen = false; ui.pasteResult = null; ui.confirmReset = false;
      save(); render();
      var again = $('flowSel'); if (again) again.focus();
      return;
    }
    if (route() === 'editar') {
      if (t.tagName === 'SELECT') editorInput(t);
      else if (t.getAttribute('data-f') === 'dep') editorDepChange(t);
      return;
    }
    if (t.id === 'hlCat') { ui.hlCat = t.value; ui.hlVal = ''; renderPhase('hlCat'); }
  });
  app.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var node = ev.target.closest && ev.target.closest('.node.clickable');
    if (node && route() === 'ver' && ui.phase === 'review') { ev.preventDefault(); selectNode(node); }
    if (ev.key === 'Enter' && ev.target.id === 'newCat') { ev.preventDefault(); $('addCat').click(); }
  });
  if (MOBILE.addEventListener) MOBILE.addEventListener('change', function () { if (route() === 'ver' && ui.phase === 'tour') renderPhase(); });
  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
